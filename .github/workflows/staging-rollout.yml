name: Rehearse local staging image rollback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-staging.txt
      - run: python -m pip check
      - run: python scripts/staging_lab.py build
      - run: python scripts/verify_staging_rollout.py --output data/evidence/staging-rollout-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-staging-rollout
          path: data/evidence/staging-rollout-ci.json
          retention-days: 7
