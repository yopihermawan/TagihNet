name: Measure local staging load
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-load.yml'
      - 'scripts/staging_load.py'
      - 'scripts/staging_lab.py'
      - 'scripts/staging_ops.py'
      - 'scripts/verify_staging.py'
      - 'scripts/verify_staging_backup.py'
      - 'scripts/ops_smoke.py'
      - 'Dockerfile.staging'
      - 'Dockerfile.staging.dockerignore'
      - 'compose.staging.yaml'
      - 'deploy/**'
      - 'requirements.txt'
      - 'requirements-postgres.txt'
      - 'requirements-staging.txt'
permissions:
  contents: read
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-staging.txt
      - run: python -m pip check
      - name: Build and identify the staging image
        id: staging_image
        shell: bash
        run: |
          python scripts/staging_lab.py build
          image_id=$(docker --host=unix:///var/run/docker.sock image inspect tagihnet-staging:local --format '{{.Id}}')
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
      - name: Measure the pinned staging image
        env:
          TAGIHNET_LOAD_IMAGE_ID: ${{ steps.staging_image.outputs.id }}
        run: python scripts/staging_load.py --image-id "$TAGIHNET_LOAD_IMAGE_ID" --output data/evidence/staging-load-ci.json
      - name: Summarize the load report
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('data/evidence/staging-load-ci.json')
          if not path.is_file():
              raise SystemExit(0)
          report = json.loads(path.read_text())
          result = f"Result {report['status']} with cleanup {report['cleanup']}."
          level = 'notice' if report['status'] == 'passed' else 'error'
          failures = ', '.join(report['failures'])
          phase = report.get('failed_phase')
          monitor_issues = sorted({issue['code'] for sample in report.get('monitoring', {}).get('samples', [])
                                   for issue in sample['issues']})
          details = [result]
          if failures:
              details.append(f'Failed checks: {failures}.')
          if phase:
              details.append(f'Phase: {phase}.')
          if monitor_issues:
              details.append(f"Monitor: {', '.join(monitor_issues)}.")
          print(f"::{level} title=Staging load result::{' '.join(details)}")
          rows = ['## Staging load', '', *details, '']
          if report['stages']:
              rows.extend(['| Clients | Requests | Failures | P95 (ms) | Worst endpoint P95 (ms) |',
                           '| ---: | ---: | ---: | ---: | ---: |'])
              for stage in report['stages']:
                  stats = stage['overall']
                  endpoints = stage['endpoints']
                  worst_p95 = max((value['p95_ms'] for value in endpoints.values()
                                   if value['p95_ms'] is not None), default=None)
                  print(f"::notice title=Load with {stage['concurrency']} clients::"
                        f"{stats['attempts']} requests, {stats['failures']} failed, "
                        f"P95 {stats['p95_ms']} ms, worst endpoint P95 {worst_p95} ms.")
                  rows.append(f"| {stage['concurrency']} | {stats['attempts']} | {stats['failures']} | "
                              f"{stats['p95_ms']} | {worst_p95} |")
                  for name, values in endpoints.items():
                      p95 = values['p95_ms']
                      if values['attempts'] < 3 or values['failures'] or p95 is None or p95 > report['p95_limit_ms']:
                          errors = ', '.join(f'{code}={count}' for code, count in values['errors'].items())
                          print(f"::warning title=Load check for {name} with {stage['concurrency']} clients::"
                                f"{values['failures']}/{values['attempts']} failed, P95 {p95} ms. {errors}")
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write('\n'.join(rows) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-staging-load
          path: data/evidence/staging-load-ci.json
          retention-days: 7
          if-no-files-found: ignore
